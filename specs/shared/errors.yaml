openapi: 3.1.0
info:
  title: Shared Error Components
  version: 1.0.0
  description: Canonical error schemas reused across pcampus-openapi-kit modules.

paths: {}

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code in SCREAMING_SNAKE_CASE.
              example: CUSTOMER_NOT_FOUND
            message:
              type: string
              description: Human-readable summary suitable for logs and UI.
              example: Customer does not exist.
            details:
              type: object
              description: Optional structured context such as field validation errors.
              additionalProperties: true

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        error:
          code: VALIDATION_ERROR
          message: One or more fields are invalid.
          details:
            email: Must be a valid email address.
