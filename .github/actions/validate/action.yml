name: Validate OpenAPI
description: Lint and validate an OpenAPI spec using pcampus-openapi-kit conventions

inputs:
  spec:
    description: Path to the OpenAPI file
    required: true
  working-directory:
    description: Working directory for the command
    required: false
    default: .

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Lint spec
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "${{ github.workspace }}/bin/pcampus-openapi-kit.js" lint "${{ inputs.spec }}"

    - name: Validate spec
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "${{ github.workspace }}/bin/pcampus-openapi-kit.js" validate "${{ inputs.spec }}"
